<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog — Brenn Consulting</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800;900&family=Barlow:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Barlow',sans-serif;background:#fff;color:#0a0a0a;}
nav{position:sticky;top:0;background:rgba(255,255,255,0.97);border-bottom:1px solid #e0e0e0;padding:0 48px;height:56px;display:flex;align-items:center;justify-content:space-between;z-index:100;}
.nav-name{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:14px;letter-spacing:.06em;text-decoration:none;color:#0a0a0a;}
.nav-back{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#1651C8;text-decoration:none;}
.hero{padding:80px 48px 60px;border-bottom:1px solid #0a0a0a;}
.label{font-size:10px;font-weight:700;letter-spacing:.25em;text-transform:uppercase;color:#1651C8;margin-bottom:20px;}
h1{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:clamp(48px,7vw,96px);line-height:.92;letter-spacing:-.01em;}
.grid{max-width:1400px;margin:0 auto;padding:60px 48px;display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#e0e0e0;}
.card{background:#fff;padding:40px 32px;text-decoration:none;color:#0a0a0a;display:block;transition:background .15s;}
.card:hover{background:#f5f5f5;}
.card-date{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#888;margin-bottom:16px;}
.card-title{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:26px;line-height:1.1;margin-bottom:12px;}
.card-desc{font-size:14px;font-weight:300;color:#888;line-height:1.6;}
.empty{grid-column:1/-1;padding:80px;text-align:center;font-size:18px;font-weight:300;color:#888;background:#fff;}
@media(max-width:900px){nav{padding:0 20px;}.hero{padding:60px 20px 40px;}.grid{padding:40px 20px;grid-template-columns:1fr;}}
</style>
</head>
<body>
<nav>
  <a href="/" class="nav-name">BRENN CONSULTING</a>
  <a href="/" class="nav-back">← Torna al sito</a>
</nav>
<div class="hero">
  <div class="label">Blog — Risorse per professionisti</div>
  <h1>Presenza digitale.<br>Spiegata senza fuffa.</h1>
</div>
<div class="grid">
  <div class="empty">I primi articoli arrivano presto.</div>
</div>
</body>
</html>
