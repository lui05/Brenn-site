name: Generate Daily Articles

on:
  schedule:
    - cron: '0 7 * * *'   # ogni giorno alle 7:00 UTC (9:00 ora italiana)
  workflow_dispatch:        # permette avvio manuale dal pannello GitHub

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install @anthropic-ai/sdk

      - name: Generate articles
        run: node scripts/generate-articles.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Build site with Eleventy
        run: npx @11ty/eleventy

      - name: Commit and push
        run: |
          git config user.name "Brenn Bot"
          git config user.email "bot@brenn.it"
          git add src/posts/ src/blog.html src/sitemap.xml scripts/topics.json
          git commit -m "Auto: add daily articles $(date +%Y-%m-%d) [skip ci]" || echo "Nothing to commit"
          git push
